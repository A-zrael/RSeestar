[package]
name = "rseestar"
version = "0.1.0"
edition = "2024"
description = "Native Seestar transfer, live view, weather, stacking, and FITS preview tool"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
serde_json = "1.0"
smb2 = "0.22.1"
tokio = { version = "1.47", features = ["rt", "net", "time"] }
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
